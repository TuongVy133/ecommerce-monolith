services:
  db:
    image: postgres:16
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: ecommerce-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/ecommerce?schema=public
      JWT_SECRET: doi-chuoi-nay-thanh-bi-mat-cua-ban
      JWT_EXPIRES_IN: 1d
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
